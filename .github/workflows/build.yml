name: Windows build and viewport tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Material Lab
        run: msbuild KichRay_MaterialLab.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /verbosity:minimal
      - name: Compile and run viewport regressions
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.platform == 'x64' && 'x64' || 'x86' }}
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /Isrc tests\ViewportToolsTests.cpp src\Core.cpp src\DDS.cpp /Fe:viewport-tests.exe
          if errorlevel 1 exit /b 1
          viewport-tests.exe
      - name: Run Win32 and D3D11 WARP smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "bin/Release/${{ matrix.platform }}/MaterialLab.exe"
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Material Lab smoke test timed out' }
          Get-Content "bin/Release/${{ matrix.platform }}/smoke-tests.txt" -ErrorAction Continue
          if ($process.ExitCode -ne 0) { throw "Material Lab smoke test failed: $($process.ExitCode)" }
